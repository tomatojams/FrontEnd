<button>버튼0</button>

<script>
  // 1. 백틱 - 엔터넣어서 줄바꿈 가능, ""와 ''는 줄바꿈이 안됨
  // 2. ${} - 변수, 연산자, 함수호출 가능, ""와 ''는 +로 연결해야함
  // 3. html 태그를 넣을때는 ${}를 사용해야함


  let name = "김지한"; 
  let template = `<div>${name}</div>`;
  var str = `안녕하세요 저는 ${name}입니다.

  반갑습니다.`;
  console.log(str);

  // 4. tagged literal 문자열을 해체 분석하는 함수기능 -> 해체분석기(문자열, 변수)-> array로, 변수로 담아줌
  // 문자열 순서 변수 순서 변경가능

  function 해체분석기(문자, 변수) {
    console.log(문자[1]+문자[0]+변수);
    console.log(변수);
  }

  해체분석기`안녕${name}하세요`; // 함수호출도 가능
</script>
