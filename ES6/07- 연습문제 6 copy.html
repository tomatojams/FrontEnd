<div style="display: none">모달창1</div>

<button>버튼0</button>
<button>버튼1</button>

<script>
  var button = document.querySelectorAll("button");

// let으로 내부 생성효과를 줌
  for (let i = 0; i < button.length; i++) {
    button[i].addEventListener("click", function () {
      modal[i].style.display = "block";
    });
  }
</script>
